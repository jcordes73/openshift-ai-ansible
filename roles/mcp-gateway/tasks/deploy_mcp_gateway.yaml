- name: Deploy MCP Gateway
  redhat.openshift.k8s:
    template: gateway-mcp.yaml.j2
    host: "{{ openshift_api_url }}"
    api_key: "{{ openshift_token }}"
    validate_certs: false
- name: Create Reference Grant
  redhat.openshift.k8s:
    src: reference-grant.yaml
    host: "{{ openshift_api_url }}"
    api_key: "{{ openshift_token }}"
    validate_certs: false
- name: Create MCP Gateway Extension
  redhat.openshift.k8s:
    src: mcpgateway-extension.yaml
    host: "{{ openshift_api_url }}"
    api_key: "{{ openshift_token }}"
    validate_certs: false

