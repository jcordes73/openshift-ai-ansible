- name: Wait for Postgres Deployment
  kubernetes.core.k8s_info:
    api_version: apps.openshift.io/v1
    kind: DeploymentConfig
    name: postgres
    namespace: postgres
    host: "{{ openshift_api_url }}"
    api_key: "{{ openshift_token }}"
    validate_certs: false
  register: postgres_deployment 
  until: postgres_deployment.resources[0].status.readyReplicas is defined and postgres_deployment.resources[0].status.readyReplicas == 1
  retries: 12
  delay: 5
- name: Set fact for postgres cluster local address
  set_fact:
    postgres_address: "postgres.postgres.svc.cluster.local"
