- name: Include openshift/common role
  include_role:
    name: openshift/common
    public: true
  when: openshift_token is undefined
- name: Include AI model catalog
  ansible.builtin.include_vars:
    file: "{{ role_path }}/../../../ai-models/vars/ai_models.yaml" 
- name: Include AWS NVidia GPU Nodes
  ansible.builtin.include_vars:
    file: nvidia_gpu_nodes.yaml
- name: Create NVIDIA GPU Machineset
  redhat.openshift.k8s:
    template: openshift-nvidia-gpu-machineset.yaml.j2
    host: "{{ openshift_api_url }}"
    api_key: "{{ openshift_token }}"
    validate_certs: false
  when: ai_models | selectattr('ai_model_id','in', ai_models_enabled) | selectattr('ai_model_size','equalto', item) | length > 0
  with_items:
  - medium
  - large
- name: Wait until OpenShift GPU MachineSet is available
  kubernetes.core.k8s_info:
    api_version: machine.openshift.io/v1beta1
    kind: MachineSet
    name: "{{ aws_infrastructure_id }}-nvidia-gpu-{{ item }}-{{ aws_zone }}"
    namespace: openshift-machine-api
    host: "{{ openshift_api_url }}"
    api_key: "{{ openshift_token }}"
    validate_certs: false
  register: machineset_nvidia_gpu
  retries: 20
  delay: 30
  until: machineset_nvidia_gpu.resources[0].status.readyReplicas is defined and machineset_nvidia_gpu.resources[0].status.readyReplicas|int == machineset_nvidia_gpu.resources[0].spec.replicas
  when: ai_models | selectattr('ai_model_id','in', ai_models_enabled) | selectattr('ai_model_size','equalto', item) | length > 0
  with_items:
  - medium
  - large
