- name: Create Cluster Monitoring Config
  redhat.openshift.k8s:
    src: cluster-monitoring-config.yaml
    host: "{{ openshift_api_url }}"
    api_key: "{{ openshift_token }}"
    validate_certs: false
- name: Create grafana namespace
  redhat.openshift.k8s:
    src: namespace.yaml
    host: "{{ openshift_api_url }}"
    api_key: "{{ openshift_token }}"
    validate_certs: false
- name: Create Operator Group
  redhat.openshift.k8s:
    src: operator-group.yaml
    host: "{{ openshift_api_url }}"
    api_key: "{{ openshift_token }}"
    validate_certs: false
- name: Create Grafana Subscription
  redhat.openshift.k8s:
    src: grafana-sub.yaml
    host: "{{ openshift_api_url }}"
    api_key: "{{ openshift_token }}"
    validate_certs: false
- name: Wait until Grafana subscription is "Ready"
  redhat.openshift.k8s:
    kind: Subscription
    api_version: operators.coreos.com/v1alpha1
    name: grafana
    namespace: grafana
    host: "{{ openshift_api_url }}"
    api_key: "{{ openshift_token }}"
    validate_certs: false
  register: grafana_sub
  until: grafana_sub.result.status.state is defined and (grafana_sub.result.status.state == 'AtLatestKnown' or grafana_sub.result.status.state == 'UpgradeAvailable')
  retries: 12
  delay: 5
- name: Create Cluster Monitoring View Role
  redhat.openshift.k8s:
    src: grafana-cluster-monitoring-view-role.yaml
    host: "{{ openshift_api_url }}"
    api_key: "{{ openshift_token }}"
    validate_certs: false
- name: Wait until Grafana CRD is available
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: grafanas.grafana.integreatly.org
    host: "{{ openshift_api_url }}"
    api_key: "{{ openshift_token }}"
    validate_certs: false
  register: grafana_crd
  retries: 200
  delay: 10
  until: grafana_crd.resources | list | length == 1
