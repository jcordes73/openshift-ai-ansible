- name: Wait for Grafana deployment
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Deployment
    name: grafana-deployment
    namespace: grafana
    host: "{{ openshift_api_url }}"
    api_key: "{{ openshift_token }}"
    validate_certs: false
  register: grafana_deployment
  until: grafana_deployment.resources[0].status.readyReplicas is defined and grafana_deployment.resources[0].status.readyReplicas == 1
  retries: 12
  delay: 10
- name: Create token
  shell: oc create token grafana-sa --duration=$((365*24))h -n grafana -s {{ openshift_api_url }} --token={{ openshift_token }} -s {{ openshift_api_url }} --token {{ openshift_token }} --insecure-skip-tls-verify=true
  register: grafana_token
- name: Create Grafana Datasource
  redhat.openshift.k8s:
    template: grafana-datasource.yaml.j2
    host: "{{ openshift_api_url }}"
    api_key: "{{ openshift_token }}"
    validate_certs: false
- name: Create Grafana Dashboard Route
  redhat.openshift.k8s:
    template: grafana-route.yaml.j2
    host: "{{ openshift_api_url }}"
    api_key: "{{ openshift_token }}"
    validate_certs: false
