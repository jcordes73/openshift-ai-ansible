- name: Create Apicurio Registry Postgres DB Secret
  redhat.openshift.k8s:
    src: postgresql-credentials.yaml
    namespace: apicurio-registry
    host: "{{ openshift_api_url }}"
    api_key: "{{ openshift_token }}"
    validate_certs: false
- name: Deploy Apicurio Registry Postgres instance
  include_role:
    name: postgres
  vars:
    postgres_name: postgres
    postgres_namespace: apicurio-registry
    postgres_database: registry
- name: Create Apicurio Registry database schema
  shell: |
    cat {{ role_path }}/../postgres/files/create-db.sh | sed 's/DATABASE/registry/g' | oc exec dc/postgres -n apicurio-registry -s {{ openshift_api_url }} --token {{ openshift_token }} --insecure-skip-tls-verify=true -i -t -- bash -il
  when: postgres_deployment.resources[0].status is undefined
- name: Create Apicurio Registry instance
  redhat.openshift.k8s:
    template: apicurio-registry.yaml.j2
    namespace: apicurio-registry
    host: "{{ openshift_api_url }}"
    api_key: "{{ openshift_token }}"
    validate_certs: false
- name: Check for Apicurio Registry App deployment
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Deployment
    name: apicurio-app-deployment
    namespace: apicurio-registry 
    host: "{{ openshift_api_url }}"
    api_key: "{{ openshift_token }}"
    validate_certs: false
  register: apicurio_app_deployment
  until: apicurio_app_deployment.resources[0].status.readyReplicas is defined and apicurio_app_deployment.resources[0].status.readyReplicas == 1
  retries: 12
  delay: 10
- name: Check for Apicurio Registry UI deployment
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Deployment
    name: apicurio-ui-deployment
    namespace: apicurio-registry
    host: "{{ openshift_api_url }}"
    api_key: "{{ openshift_token }}"
    validate_certs: false
  register: apicurio_ui_deployment
  until: apicurio_ui_deployment.resources[0].status.readyReplicas is defined and apicurio_app_deployment.resources[0].status.readyReplicas == 1
  retries: 12
  delay: 10
