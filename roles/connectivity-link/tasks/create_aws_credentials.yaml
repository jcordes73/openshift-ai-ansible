- name: Create Kuadrant AWS credentials secret for Route53
  redhat.openshift.k8s:
    template: aws-credentials-secret.yaml.j2
    namespace: "{{ item }}"
    host: "{{ openshift_api_url }}"
    api_key: "{{ openshift_token }}"
    validate_certs: false
  loop:
    - cert-manager
    - gateway-system
